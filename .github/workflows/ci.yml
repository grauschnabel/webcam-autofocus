name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-opencv opencv-data python3-numpy python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 v4l-utils fakeroot lintian python3-pyflakes
      - run: python3 -m pyflakes .
      - run: python3 -m unittest -v
      - name: Build .deb
        run: packaging/build-deb.sh
      - name: Check the package
        run: |
          dpkg-deb --info dist/*.deb
          lintian --fail-on error dist/*.deb
